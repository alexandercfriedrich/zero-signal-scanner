name: Research Tests

on:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  research-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run targeted research tests
        run: python -m unittest tests/test_backtest_engine_research.py tests/test_research_workflow.py
