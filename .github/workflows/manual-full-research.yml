name: Manual Full Research Backtest

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git branch or commit SHA to test"
        required: true
        default: "copilot/implement-research-backtest-workflow"
        type: string
      as_of:
        description: "Last data date, YYYY-MM-DD"
        required: true
        default: "2026-09-16"
        type: string
      universe:
        description: "Universe to test"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - sp500
          - nasdaq100

permissions:
  contents: read

concurrency:
  group: manual-full-research
  cancel-in-progress: false

jobs:
  full-research:
    name: Full research (${{ inputs.universe }}, ${{ inputs.as_of }})
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out selected research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt

      - name: Run full research backtest
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python app/research_workflow.py \
            --universe "${{ inputs.universe }}" \
            --as-of "${{ inputs.as_of }}" \
            --warmup-bdays 300 \
            --cache-dir "${{ runner.temp }}/zero_swing_cache" \
            --output-dir research_outputs_full \
            --full-research

      - name: Upload full research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-research-${{ inputs.universe }}-${{ inputs.as_of }}
          path: |
            research_outputs_full/
          if-no-files-found: warn
          retention-days: 30
